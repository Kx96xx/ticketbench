[project]
name = "ticketbench"
version = "0.0.1"
description = "Can an AI agent diagnose a mobile connectivity ticket from a packet capture?"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "capsight>=0.3.0",
    "tshark-mcp-server==0.4.0",
]
authors = [{ name = "Kx96xx" }]

[project.scripts]
ticketbench = "ticketbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
